[package]
name = "valen-text-components"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
[lib]
crate-type = ["staticlib"]
[dependencies]
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
serde_json = "1"
minijinja = { version = "=3.0.3", features = ["json", "fuel", "serde"] }
minijinja-contrib = { version = "=3.0.3", features = ["pycompat"] }
